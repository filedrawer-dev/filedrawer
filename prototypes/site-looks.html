<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>File Drawer Looks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Doto:wght@700;900&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&family=Martian+Mono:wght@300;400;600&display=swap">
<style>
/* Prototype: five looks for filedrawer.dev's pages for people, switchable by #hash and a bottom bar.
   Each look commits to one theme of its own; the page background follows the current look. */
:root {
  --page-bg: #242424; --page-fg: #a8f0a8;
  --chrome-bg: #ffffff; --chrome-fg: #111111; --chrome-dim: #5a5a5a;
  color-scheme: dark;
}
html[data-v="phosphor"]  { --page-bg: #242424; --page-fg: #a8f0a8; color-scheme: dark; }
html[data-v="manpage"]   { --page-bg: #fcfcfa; --page-fg: #1a1a1a; color-scheme: light; }
html[data-v="bootlog"]   { --page-bg: #0a0b0d; --page-fg: #c8ccd2; color-scheme: dark; }
html[data-v="dotmatrix"] { --page-bg: #0d0c0a; --page-fg: #ebe6dc; color-scheme: dark; }
html[data-v="catalog"]   { --page-bg: #59616a; --page-fg: #22201c; color-scheme: light; }
html[data-v="catalogdark"] { --page-bg: #1a1d22; --page-fg: #ebe5d6; color-scheme: dark; }
body { background: var(--page-bg); color: var(--page-fg); margin: 0; }
.v { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 2rem 9rem; }
.v * { box-sizing: border-box; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

/* prototype chrome: the page break and the switcher, deliberately not part of any look */
.sep { display: flex; justify-content: center; margin: 4rem 0 3rem; }
.sep span { font: 600 12px/1 system-ui, sans-serif; background: var(--chrome-bg); color: var(--chrome-fg); padding: .55rem .9rem; border-radius: 999px; box-shadow: 0 2px 10px rgb(0 0 0 / .25); letter-spacing: .02em; }
.sw { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  display: flex; align-items: center; gap: .5rem; width: min(36rem, calc(100vw - 24px));
  background: var(--chrome-bg); color: var(--chrome-fg); border-radius: 14px; padding: .5rem; box-shadow: 0 6px 28px rgb(0 0 0 / .35);
  font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
.sw button { flex: none; width: 2.4rem; height: 2.4rem; border: 0; border-radius: 10px; background: #ececec; color: var(--chrome-fg); font-size: 1.1rem; cursor: pointer; }
.sw button:hover { background: #dcdcdc; }
.sw-mid { flex: 1; min-width: 0; text-align: center; }
.sw-mid b { font-weight: 650; }
.sw-mid .n { color: var(--chrome-dim); font-variant-numeric: tabular-nums; }
.sw-mid .d { display: block; color: var(--chrome-dim); font-size: 12px; }

/* ───────── A. Phosphor ───────── */
#phosphor { --a-bg: #242424; --a-fg: #a8f0a8; --a-head: #7dff7d; --a-dim: #73a873; --a-link: #4fc24f; --a-rule: #4d7d4d; --a-code: #1b1b1b;
  font: 15px/1.5 ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace; color: var(--a-fg); }
#phosphor .col { max-width: 50rem; margin: 0 auto; }
#phosphor h1 { color: var(--a-head); font-size: 1.9rem; font-weight: 700; margin: 0; padding-bottom: .2rem; border-bottom: 1px solid var(--a-head); text-wrap: balance; line-height: 1.2; }
#phosphor h1.small { font-size: 1.45rem; }
#phosphor h2 { color: var(--a-head); font-size: 1.35rem; font-weight: 400; margin: 2.2rem 0 .8rem; border-bottom: 1px solid var(--a-rule); }
#phosphor .by { margin: .3rem 0 1.4rem; color: var(--a-fg); }
#phosphor .by i { color: var(--a-dim); }
#phosphor a { color: var(--a-link); text-decoration: none; }
#phosphor a:hover { text-decoration: underline; }
#phosphor p { max-width: 72ch; }
#phosphor pre { background: var(--a-code); padding: .7rem .9rem; overflow-x: auto; white-space: pre-wrap; border-left: 2px solid var(--a-rule); }
#phosphor form { display: flex; gap: .5rem; flex-wrap: wrap; }
#phosphor input { flex: 1; min-width: 0; background: var(--a-code); border: 1px solid var(--a-rule); color: var(--a-fg); font: inherit; padding: .35rem .5rem; }
#phosphor button { background: none; border: 1px solid var(--a-head); color: var(--a-head); font: inherit; padding: .35rem .9rem; cursor: pointer; }
#phosphor ul.entries { list-style: none; padding: 0; display: grid; gap: .9rem; }
#phosphor .meta { color: var(--a-dim); font-size: .9em; }
#phosphor b { color: var(--a-head); }
#phosphor .tw { overflow-x: auto; }
#phosphor table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
#phosphor th, #phosphor td { text-align: left; padding: .25rem .9rem .25rem 0; border-bottom: 1px dashed var(--a-rule); white-space: nowrap; }
#phosphor th { color: var(--a-head); font-weight: 400; }
#phosphor footer { margin-top: 3rem; border-top: 1px solid var(--a-rule); padding-top: .4rem; font-size: .85em; color: var(--a-dim); }

/* ───────── B. Man page ───────── */
#manpage { --b-fg: #1a1a1a; --b-dim: #6b6b6b; --b-rule: #d6d6d0;
  font: 15px/1.55 "IBM Plex Mono", ui-monospace, "DejaVu Sans Mono", Menlo, monospace; color: var(--b-fg); }
#manpage .col { max-width: 84ch; margin: 0 auto; }
#manpage .hd { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
#manpage .hd .mid { color: var(--b-dim); }
#manpage h2 { font-size: 1em; font-weight: 600; margin: 1.6rem 0 .3rem; letter-spacing: .02em; }
#manpage .in { padding-left: 7ch; }
#manpage p { margin: 0 0 .8rem; max-width: 72ch; }
#manpage a { color: var(--b-fg); }
#manpage u, #manpage .arg { text-decoration: underline; text-underline-offset: 2px; }
#manpage dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .35rem 2ch; }
#manpage dt { font-weight: 600; }
#manpage dd { margin: 0; min-width: 0; }
#manpage input { font: inherit; color: var(--b-fg); background: transparent; border: 0; border-bottom: 1px solid var(--b-fg); width: 28ch; max-width: 100%; padding: 0 .2rem; }
#manpage pre { margin: .2rem 0 .8rem; overflow-x: auto; font: inherit; }
#manpage pre.wrap { white-space: pre-wrap; padding-left: 4ch; }
#manpage .ft { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 2.5rem; color: var(--b-dim); }
@media (max-width: 560px) { #manpage .in { padding-left: 2ch; } #manpage .hd .mid { display: none; } #manpage dl { grid-template-columns: 1fr; } #manpage dd { padding-left: 2ch; margin-bottom: .4rem; } }

/* ───────── C. Boot log ───────── */
#bootlog { --c-fg: #c8ccd2; --c-dim: #6e747d; --c-null: #5fd068; --c-inc: #e5c14a; --c-eff: #56c8d8; --c-path: #6aa7ff; --c-band: #1a1d22;
  font: 14px/1.6 "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", Menlo, monospace; color: var(--c-fg); }
#bootlog .col { max-width: 74rem; margin: 0 auto; }
#bootlog p { margin: 0; }
#bootlog .dim { color: var(--c-dim); }
#bootlog .u { color: var(--c-null); font-weight: 700; }
#bootlog .p { color: var(--c-path); font-weight: 700; }
#bootlog .motd { margin-bottom: 1.4rem; }
#bootlog .motd b { color: #ffffff; }
#bootlog a { color: inherit; text-decoration: none; }
#bootlog a:hover .t { text-decoration: underline; }
#bootlog .prompt { display: flex; gap: 1ch; flex-wrap: wrap; align-items: baseline; margin-top: 1rem; }
#bootlog input { flex: 1; min-width: 12ch; font: inherit; color: #ffffff; background: transparent; border: 0; caret-color: var(--c-null); padding: 0; }
#bootlog input::placeholder { color: var(--c-dim); }
#bootlog .log { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr) max-content max-content; column-gap: 2ch; margin-top: .2rem; }
#bootlog .log a { display: contents; }
#bootlog .log a > span { padding: .05rem 0; }
#bootlog .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#bootlog .tag { white-space: pre; }
#bootlog .tag .null { color: var(--c-null); } #bootlog .tag .inconclusive { color: var(--c-inc); } #bootlog .tag .effect { color: var(--c-eff); }
#bootlog .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--c-fg); vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #bootlog .cursor { animation: none; } }
#bootlog pre { font: inherit; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
#bootlog .delim { background: var(--c-band); color: var(--c-inc); display: block; }
#bootlog .k { color: var(--c-dim); }
#bootlog .h { color: #ffffff; font-weight: 700; }
#bootlog .fm { color: var(--c-eff); }
@media (max-width: 760px) {
  #bootlog .log { grid-template-columns: max-content minmax(0, 1fr); }
  #bootlog .log .kind, #bootlog .log .date { display: none; }
  #bootlog .log .id { grid-column: 2; }
  #bootlog .log .t { grid-column: 1 / -1; white-space: normal; padding-bottom: .5rem; }
}

/* ───────── D. Dot matrix ───────── */
#dotmatrix { --d-fg: #ebe6dc; --d-dim: #8f887b; --d-line: #34302a; --d-amber: #ffb000; --d-ink: #1a1206; --d-surface: #15130f;
  --d-display: "Doto", ui-monospace, monospace; --d-body: "Martian Mono", ui-monospace, Menlo, monospace;
  font: 300 13px/1.7 var(--d-body); color: var(--d-fg); }
#dotmatrix .col { max-width: 72rem; margin: 0 auto; }
#dotmatrix a { color: inherit; }
#dotmatrix .bar { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; padding-bottom: 1rem; border-bottom: 1px dashed var(--d-line); }
#dotmatrix .logo { font: 900 1.35rem/1 var(--d-display); letter-spacing: .02em; }
#dotmatrix .nav { display: flex; gap: 1.4rem; flex: 1; flex-wrap: wrap; color: var(--d-dim); }
#dotmatrix .nav a { text-decoration: none; }
#dotmatrix .nav a:hover { color: var(--d-fg); }
#dotmatrix .btn { display: inline-flex; align-items: center; gap: .6rem; background: var(--d-amber); color: var(--d-ink); text-decoration: none; padding: .5rem .9rem; font-weight: 400; border: 0; font: inherit; cursor: pointer; }
#dotmatrix .btn.ghost { background: transparent; color: var(--d-fg); border: 1px dashed var(--d-line); }
#dotmatrix .hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 3rem; align-items: center; padding: 4rem 0 3.5rem; border-bottom: 1px dashed var(--d-line); }
#dotmatrix .eyebrow { color: var(--d-dim); font-size: 12px; letter-spacing: .06em; display: flex; align-items: center; gap: .6rem; }
#dotmatrix .eyebrow::before { content: ""; width: 8px; height: 8px; background: var(--d-amber); }
#dotmatrix h1 { font: 900 clamp(2.1rem, 4.4vw, 3.5rem)/1.08 var(--d-display); margin: 1rem 0 1.4rem; letter-spacing: -.01em; text-wrap: balance; }
#dotmatrix h1 mark { background: var(--d-amber); color: var(--d-ink); padding: 0 .12em; }
#dotmatrix .lede { color: var(--d-dim); font-size: 14px; max-width: 52ch; margin: 0 0 1.6rem; }
#dotmatrix .ctas { display: flex; gap: .8rem; flex-wrap: wrap; }
#dotmatrix .qs { border: 1px solid var(--d-line); background: var(--d-surface); min-width: 0; }
#dotmatrix .tabs { display: flex; border-bottom: 1px solid var(--d-line); overflow-x: auto; }
#dotmatrix .tabs button { background: none; border: 0; color: var(--d-dim); font: inherit; padding: .7rem 1rem; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
#dotmatrix .tabs button[aria-selected="true"] { color: var(--d-amber); border-bottom-color: var(--d-amber); }
#dotmatrix .qs pre { margin: 0; padding: 1.1rem 1rem; font: 400 13px/1.7 var(--d-body); white-space: pre-wrap; overflow-wrap: anywhere; }
#dotmatrix .qs pre span { color: var(--d-amber); }
#dotmatrix .qs .note { border-top: 1px dashed var(--d-line); padding: .6rem 1rem; color: var(--d-dim); font-size: 12px; }
#dotmatrix section { padding: 3rem 0; border-bottom: 1px dashed var(--d-line); }
#dotmatrix h2 { font: 900 clamp(1.8rem, 4vw, 2.6rem)/1.05 var(--d-display); margin: .6rem 0 1.6rem; }
#dotmatrix .dist { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
#dotmatrix .dist .num { font: 900 3rem/1 var(--d-display); font-variant-numeric: tabular-nums; }
#dotmatrix .dist .num.a { color: var(--d-amber); }
#dotmatrix .dots { display: grid; grid-template-columns: repeat(50, minmax(0, 1fr)); gap: 4px; margin: 1.6rem 0 .4rem; max-width: 46rem; }
#dotmatrix .dots i { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--d-line); }
@media (max-width: 560px) { #dotmatrix .dots { grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 3px; } }
#dotmatrix .dots i.n { background: var(--d-amber); } #dotmatrix .dots i.i { background: #8a6a20; } #dotmatrix .dots i.e { background: var(--d-dim); }
#dotmatrix .small { color: var(--d-dim); font-size: 11.5px; }
#dotmatrix .tw { overflow-x: auto; }
#dotmatrix table { width: 100%; border-collapse: collapse; }
#dotmatrix th { text-align: left; font-weight: 400; color: var(--d-dim); font-size: 11.5px; letter-spacing: .06em; padding: .5rem 1rem .5rem 0; border-bottom: 1px dashed var(--d-line); }
#dotmatrix td { padding: .8rem 1rem .8rem 0; border-bottom: 1px dashed var(--d-line); vertical-align: top; }
#dotmatrix td.oc { font: 900 1.25rem/1.2 var(--d-display); white-space: nowrap; }
#dotmatrix td.oc.null { color: var(--d-amber); }
#dotmatrix td.dt { color: var(--d-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
#dotmatrix .entry { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 3rem; padding-top: 1rem; }
#dotmatrix .entry h1.t { font: 600 clamp(1.3rem, 2.6vw, 1.8rem)/1.35 var(--d-body); margin: .8rem 0 1rem; }
#dotmatrix .hyp { color: var(--d-dim); font-size: 14px; }
#dotmatrix .ci { margin: 1.8rem 0 .4rem; }
#dotmatrix .ci svg { width: 100%; height: auto; display: block; }
#dotmatrix .ci .axis { stroke: var(--d-dim); stroke-width: 1; }
#dotmatrix .ci .zero { stroke: var(--d-fg); stroke-width: 1; stroke-dasharray: 3 3; }
#dotmatrix .ci .int { fill: var(--d-amber); }
#dotmatrix .ci .pt { fill: var(--d-fg); stroke: var(--d-ink); stroke-width: 2; }
#dotmatrix .ci text { fill: var(--d-dim); font: 300 11px var(--d-body); }
#dotmatrix .side { border-left: 1px dashed var(--d-line); padding-left: 2rem; }
#dotmatrix .big { font: 900 4.5rem/1 var(--d-display); color: var(--d-amber); }
#dotmatrix dl { margin: 1.2rem 0 0; }
#dotmatrix dl div { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1rem; padding: .55rem 0; border-top: 1px dashed var(--d-line); }
#dotmatrix dt { color: var(--d-dim); }
#dotmatrix dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
#dotmatrix .ok { color: var(--d-amber); }
#dotmatrix h3 { font: 900 1.35rem/1.1 var(--d-display); margin: 2.2rem 0 .7rem; }
#dotmatrix ul.dash { list-style: none; padding: 0; margin: 0; }
#dotmatrix ul.dash li { padding: .3rem 0 .3rem 1.4rem; position: relative; }
#dotmatrix ul.dash li::before { content: "—"; position: absolute; left: 0; color: var(--d-amber); }
#dotmatrix .code { background: var(--d-surface); border: 1px solid var(--d-line); padding: .8rem 1rem; overflow-x: auto; white-space: pre; font: 400 12.5px/1.6 var(--d-body); }
@media (max-width: 820px) {
  #dotmatrix .hero, #dotmatrix .entry { grid-template-columns: minmax(0, 1fr); gap: 2rem; padding-top: 2.5rem; }
  #dotmatrix .side { border-left: 0; padding-left: 0; border-top: 1px dashed var(--d-line); padding-top: 1.5rem; }
  #dotmatrix .dist { grid-template-columns: minmax(0, 1fr); }
  #dotmatrix dl div { grid-template-columns: 7rem minmax(0, 1fr); }
  #dotmatrix td.md, #dotmatrix th.md { display: none; }
}

/* ───────── E. Card catalog ───────── */
.cat { --e-ink: #22201c; --e-dim: #6c675e; --e-card: #fbf8ef; --e-red: #c4453a; --e-blue: #b3c8dc; --e-brass: #b8995a; --e-manila: #e6d6a4; --e-steel: #59616a;
  --e-plate: #8f7a46; --e-platehi: #d8c38a; --e-stamp: #c4453a; --e-inc: #8a6d1d; --e-eff: #2f5f8a; --e-field: #a8996a; --e-foot: #e9e6df; --e-foot-a: #ffffff;
  --e-shadow: 0 1px 0 #00000022, 0 6px 14px #00000033; --e-hole: inset 0 2px 3px #00000066;
  font: 15px/1.5 "Courier Prime", "Courier New", ui-monospace, monospace; color: var(--e-ink); }
/* 5 in dark mode: the same markup and rules, other tokens. Charcoal card stock on dark steel. */
#catalogdark { --e-ink: #ebe5d6; --e-dim: #a0978a; --e-card: #2b2824; --e-red: #b8504a; --e-blue: #36495d; --e-brass: #9c8048; --e-manila: #4b4029; --e-steel: #1a1d22;
  --e-plate: #4f4126; --e-platehi: #c2a868; --e-stamp: #ec7565; --e-inc: #d8b052; --e-eff: #86b6e2; --e-field: #6a5d44; --e-foot: #8c939c; --e-foot-a: #dfe3e8;
  --e-shadow: 0 1px 0 #000000aa, 0 8px 18px #00000099; --e-hole: inset 0 2px 3px #000000cc; }
.cat .col { max-width: 62rem; margin: 0 auto; }
.cat .plate { border: 4px solid var(--e-brass); border-radius: 3px; padding: 6px; max-width: 34rem; margin: 0 auto 2rem; background: var(--e-plate); box-shadow: inset 0 0 0 1px var(--e-platehi); }
.cat .plate div { background: var(--e-card); padding: .6rem 1rem; text-align: center; letter-spacing: .12em; font-weight: 700; text-transform: uppercase; }
.cat .plate small { display: block; letter-spacing: .04em; font-weight: 400; text-transform: none; color: var(--e-dim); }
.cat .card { background: var(--e-card); color: var(--e-ink); position: relative; padding: 1.1rem 1.4rem 2.6rem; box-shadow: var(--e-shadow);
  background-image: linear-gradient(var(--e-card) 2.6rem, transparent 2.6rem), repeating-linear-gradient(transparent 0 calc(1.5em - 1px), var(--e-blue) calc(1.5em - 1px) 1.5em);
  background-position: 0 0, 0 1.1rem; }
.cat .card::before { content: ""; position: absolute; left: 0; right: 0; top: 2.5rem; border-top: 1.5px solid var(--e-red); }
.cat .card::after { content: ""; position: absolute; left: 50%; bottom: .7rem; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--e-steel); box-shadow: var(--e-hole); }
.cat .card p { margin: 0; overflow-wrap: anywhere; }
.cat .card .ind { text-indent: 3ch; }
.cat .card .call { display: flex; justify-content: space-between; align-items: flex-start; height: 1.6rem; }
.cat .stamp { display: inline-block; color: var(--e-stamp); border: 2px solid var(--e-stamp); border-radius: 3px; padding: 0 .45rem; font-weight: 700; letter-spacing: .14em; transform: rotate(-5deg); opacity: .85; font-size: .9em; }
.cat .stamp.inconclusive { color: var(--e-inc); border-color: var(--e-inc); }
.cat .stamp.effect { color: var(--e-eff); border-color: var(--e-eff); }
.cat .pitch { max-width: 40rem; margin: 0 auto 2.5rem; }
.cat .pitch .agent { margin-top: 1.5em; }
.cat .guides { display: flex; gap: .4rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: -1px; }
.cat .guides a { background: var(--e-manila); padding: .3rem 1rem .25rem; border-radius: 8px 8px 0 0; text-decoration: none; color: var(--e-ink); font-weight: 700; letter-spacing: .08em; font-size: .85em; }
.cat .guides a.on { padding-top: .5rem; }
.cat .guidebar { background: var(--e-manila); padding: .8rem 1rem; display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.6rem; }
.cat .guidebar input { flex: 1; min-width: 0; font: inherit; color: var(--e-ink); background: var(--e-card); border: 1px solid var(--e-field); padding: .3rem .5rem; }
.cat .guidebar button { font: inherit; font-weight: 700; background: var(--e-ink); color: var(--e-card); border: 0; padding: .35rem .9rem; cursor: pointer; }
.cat .drawer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; }
.cat .drawer a { color: inherit; text-decoration: none; }
.cat .drawer a:hover .ttl { text-decoration: underline; }
.cat .trace { margin-top: 1.5em !important; }
.cat .big { max-width: 46rem; margin: 0 auto; padding: 1.3rem 2rem 3.2rem; }

// An interval drawn in box characters, to scale: ├────[━━━╋━●━━]───┤
function asciiCI(lo, pt, hi, min, max, w) {
  const pos = v => Math.round((v - min) / (max - min) * (w - 1));
  const a = Array(w).fill("─"); a[0] = "├"; a[w - 1] = "┤";
  const l = pos(lo), h = pos(hi), z = pos(0), p = pos(pt);
  for (let i = l + 1; i < h; i++) a[i] = "━";
  a[z] = (z > l && z < h) ? "╋" : "┼"; a[l] = "["; a[h] = "]"; a[p] = "●";
  const lab = Array(w + 6).fill(" ");
  const put = (s, at) => { for (let i = 0; i < s.length; i++) lab[at + i] = s[i]; };
  put("−0.10", 0); put("0", z); put("+0.10", w - 5);
  return lab.join("").trimEnd() + "\n" + a.join("");
}

    const es = ENTRIES.filter(e => e.outcome === o);
    return `<div class="group"><div class="guide" style="--at:${at}"><span class="tab">${label}</span>${es.length} card${es.length === 1 ? "" : "s"}</div>${es.map(strip).join("")}</div>`;
  }).join("");

  <footer>terms · privacy · source (AGPL-3.0) · entries CC-BY 4.0</footer>
  ${sep("/e/" + E.id)}
  <p><a href="#drawer">← back to the drawer</a></p>
  <div class="pulled"><div class="pcard" id="g-card">
    <div class="face" id="g-front">
      <div class="call"><span>${E.id}</span><span class="stamp null">NULL</span></div>
      <p class="first">${E.author} (${DETAIL.account}).</p>
      <p class="ind"><b>${E.title}</b> / ${E.author}. — ${E.date}.</p>
      <p class="ind">1 experiment (main) : ${E.model} ; 520 prompts ; 3 GPU hours.</p>
      <p class="ind">Hypothesis: ${DETAIL.hypothesis} Predicted increase, set before run.</p>
      <p class="ind">Result: +0.012 [−0.047, +0.070], n 520/520 ; interval includes 0. Baseline 0.62.</p>
      <p class="ind">Control: pipeline check passed (this run).</p>
      <p class="ind">Not tried: ${DETAIL.notTried.join(" ")}</p>
      <p class="trace">${tracingsOf(E)} I. Title.</p>
      <span class="over">(over)</span></div>
    <div class="face" id="g-back" hidden>
      <div class="call"><span>${E.id} · back</span></div>
      <h2>Setup</h2><p>${DETAIL.setup}</p>
      <h2>Results</h2><p>Intervals: ${DETAIL.intervals}.</p>${resultsTable()}
      <h2>Caveats</h2><ul>${DETAIL.caveats.map(c => `<li>${c}</li>`).join("")}</ul>
      <h2>Reproduce</h2><pre>$ ${DETAIL.reproduce}</pre>
      <h2>Links</h2><p>code: <a href="#drawer">${DETAIL.code}</a> (pin verified)<br>logs: <a href="#drawer">${DETAIL.logs}</a></p></div>
  </div><div class="flipbar"><button type="button" class="flipbtn" id="g-flip">Turn over ↻</button></div></div>
</div>`;
};

R.catalogdark = () => R.catalog("catalogdark");

for (const l of LOOKS) document.getElementById(l.id).innerHTML = R[l.id]();

// Catalog, dark: the call slip's copy stamp.
document.getElementById("f-copy").addEventListener("click", ev => {
  const btn = ev.currentTarget;
  const selectIt = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("f-ask")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "SELECTED"; };
  if (navigator.clipboard) navigator.clipboard.writeText(ASK).then(() => { btn.textContent = "COPIED"; }, selectIt); else selectIt();
});

// Open drawer: turn the pulled card over.
document.getElementById("g-flip").addEventListener("click", ev => {
  const card = document.getElementById("g-card"), btn = ev.currentTarget;
  const swap = () => {
    const back = document.getElementById("g-back"), front = document.getElementById("g-front");
    const toBack = back.hidden; back.hidden = !toBack; front.hidden = toBack;
    btn.textContent = toBack ? "Turn back ↻" : "Turn over ↻";
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return swap();
  card.classList.add("turning");
  card.addEventListener("transitionend", () => { swap(); card.classList.remove("turning"); }, { once: true });
});

// Dot matrix: the quickstart tabs.
const CMDS = [`<span>&gt;</span> ${ASK}`, `<span>&gt;</span> ${ASK}`, `<span>$</span> curl https://filedrawer.dev/skill.md\n<span>$</span> curl 'https://filedrawer.dev/search?q=steering+vector+transfer'`];
document.querySelectorAll("#dotmatrix .tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#dotmatrix .tabs button").forEach(o => o.setAttribute("aria-selected", String(o === b)));
  document.getElementById("d-cmd").innerHTML = CMDS[+b.dataset.t];
}));

// The switcher: #hash picks the look; arrows and ←/→ cycle.
function current() { const h = location.hash.slice(1); const i = LOOKS.findIndex(l => l.id === h); return i < 0 ? 0 : i; }
function show() {
  const i = current(), l = LOOKS[i];
  for (const o of LOOKS) document.getElementById(o.id).hidden = o.id !== l.id;
  document.documentElement.dataset.v = l.id;
  document.getElementById("swName").textContent = l.name;
  document.getElementById("swNum").textContent = `${i + 1}/${LOOKS.length}`;
  document.getElementById("swDesc").textContent = l.desc + " Entries are made-up examples.";
}
function go(d) { const i = (current() + d + LOOKS.length) % LOOKS.length; location.hash = LOOKS[i].id; window.scrollTo(0, 0); }
document.getElementById("swPrev").addEventListener("click", () => go(-1));
document.getElementById("swNext").addEventListener("click", () => go(1));
document.addEventListener("keydown", ev => {
  const t = ev.target; if (t.closest && t.closest("input, textarea, [contenteditable]")) return;
  if (ev.key === "ArrowLeft") go(-1); else if (ev.key === "ArrowRight") go(1);
});
window.addEventListener("hashchange", show);
show();
</script>
