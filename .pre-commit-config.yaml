# The checks bin/git-pre-commit runs on every commit, through bin/pre-commit-run, on
# what's staged: pre-commit stashes unstaged changes first. CI runs them over every
# file. bin/slop-lint is a copy of llm-toolbox's.
repos:
  - repo: local
    hooks:
      - id: slop-lint
        name: slop-lint (the unslop skill's mechanical tells)
        entry: bin/slop-lint
        language: script
        types: [markdown]
      # The Python in bin/ (CODING_STANDARDS.md): lint and formatting, through uvx so
      # the host needs no venv.
      - id: ruff
        name: ruff check
        entry: uvx ruff@0.14.4 check
        language: system
        types: [python]
      # The formatters write; bin/pre-commit-run restages an agent's rewritten files.
      - id: ruff-format
        name: ruff format
        entry: uvx ruff@0.14.4 format
        language: system
        types: [python]
        # Copies from llm-toolbox change there and are copied back (CODING_STANDARDS.md).
        exclude: ^bin/(pre-commit-run|slop-lint)$
      # Only when a .rs file is staged, so a docs commit needs no cargo.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
      # The workflows, with shellcheck over their run blocks. Only when one is staged.
      # Both are pinned, shellcheck included: actionlint skips the shell checks
      # without a shellcheck on PATH.
      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # Every markdown file on every commit (milliseconds), so renaming a heading or
      # deleting a file that another doc links to is refused too. The field test's
      # drafts in field-test/ are skipped. bin/lychee downloads lychee once per machine,
      # pinned by SHA-256, and CI runs this same hook.
      - id: lychee
        name: lychee (links and anchors, offline)
        entry: bin/lychee
        language: script
        args:
          - --no-progress
          - --offline
          - --include-fragments
          - --exclude-path
          - field-test
          - --exclude-path
          - target
          - "**/*.md"
        pass_filenames: false
        always_run: true
