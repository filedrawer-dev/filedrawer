[package]
name = "filedrawer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "entry-check: checks File Drawer entries offline, with the analyzer filedrawer.dev runs."
homepage = "https://filedrawer.dev"
repository = "https://github.com/filedrawer-dev/filedrawer"
readme = "README.md"
keywords = ["ai-safety", "null-results", "research", "markdown", "linter"]
categories = ["command-line-utilities", "science"]
# The tests read fixtures from the analyzer's folder, which a package can't reach;
# they run from the repository.
include = ["src/**", "Cargo.toml", "README.md"]
# The binary keeps the name agents already run. The server's binary is called
# filedrawer, and two binaries of one name collide in the workspace's target/.
autobins = false

[[bin]]
name = "entry-check"
path = "src/main.rs"

[dependencies]
filedrawer-analyzer = { version = "0.1.0", path = "../analyzer" }
