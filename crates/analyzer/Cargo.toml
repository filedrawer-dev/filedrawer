[package]
name = "filedrawer-analyzer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads a File Drawer entry by docs/entry-format.md: refusals, warnings, the Results table and the card."

[lib]
name = "analyzer"

[[bin]]
name = "entry-check"
path = "src/bin/entry-check.rs"

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
yaml-rust2 = "0.13.0"

[dev-dependencies]
proptest = "1.12.0"
