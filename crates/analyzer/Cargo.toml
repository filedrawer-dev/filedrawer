[package]
name = "filedrawer-analyzer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads a File Drawer entry by docs/entry-format.md: refusals, warnings, the Results table and the card."
homepage = "https://filedrawer.dev"
repository = "https://github.com/filedrawer-dev/filedrawer"
readme = "README.md"
keywords = ["ai-safety", "null-results", "research", "markdown", "parser"]
categories = ["parser-implementations", "science"]
# The tests and their fixtures run from the repository; a user of the library
# needs only its source.
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
# DOIs in doi.org links arrive percent-encoded.
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
# Hosts read as browsers read them (WHATWG), so a link can't show one host to the
# checks and open another.
url = "2.5.8"
yaml-rust2 = "0.13.0"

[dev-dependencies]
proptest = "1.12.0"
