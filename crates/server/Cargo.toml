[package]
name = "filedrawer-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The File Drawer server: submission, reading and search."

[lib]
name = "filedrawer_server"

[[bin]]
name = "filedrawer"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
filedrawer-analyzer = { path = "../analyzer" }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "builder", "ring"] }
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
futures = "0.3.34"
http-body-util = "0.1.5"
serde_json = "1.0.154"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tower = { version = "0.5.3", features = ["util"] }
