<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}File Drawer{% endblock %} · File Drawer</title>
<link rel="stylesheet" href="{{ crate::routes::assets::stylesheet_href() }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="col">
<a class="plate" href="/"><span>File Drawer<small>"Unpublished" AI Safety results</small></span></a>
<nav class="nav" aria-label="Site"><a href="/search">Search</a> · <a href="/skill.md">/skill.md</a> · <a href="/cards.txt">/cards.txt</a> · <a href="/account">Account</a></nav>
{% block page %}
<main class="card big{% block wide %}{% endblock %}">
{% block content %}{% endblock %}
</main>
{% endblock %}
<p class="foot">Source code <a href="https://github.com/filedrawer-dev/filedrawer">AGPL-3.0</a> · Entries CC-BY 4.0</p>
</div>
</body>
</html>
