{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
{% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/reset/confirm">
<input type="hidden" name="token" value="{{ token }}">
<label>New password, at least 12 characters <input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
<button type="submit">Set the new password</button>
</form>
{% endblock %}
