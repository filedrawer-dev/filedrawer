[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"

# Password hashing is slow by design; unoptimised, it makes the account tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Unpacking attachments (#11) scans megabytes of decoded text for encoded runs and
# hashes it; unoptimised, the bomb-limit tests take seconds.
[profile.dev.package.filedrawer-analyzer]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Test builds keep line tables, so a backtrace still names each frame's file and line,
# but no other debug info, which made the test binaries 2.5 times as large and their
# rebuild a sixth slower (#35; design.md, Stack).
[profile.test]
debug = "line-tables-only"

# cargo-mutants builds with this profile (.cargo/mutants.toml): without debug info, each
# mutant links its test binaries faster.
[profile.mutants]
inherits = "test"
debug = "none"
