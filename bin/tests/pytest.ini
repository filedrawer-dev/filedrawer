# bin/tests' settings, for the two plugins bin/agent-pre-commit's uvx line installs.
# pytest-xdist runs the tests in a worker per core the run may use, at most 6: 8 were
# no faster and cost about a quarter more CPU time, which other sessions lose
# (docs/design.md, Checks). llm-toolbox's pytest.ini keeps 8, which its suite uses.
# -n0 runs one file without starting them.
# pytest-timeout fails a test still running after `timeout` seconds, so a test that
# hangs can't hold the run: on 2026-11-06 a wizard test looping on a prompt waited 15
# hours. It is the one hang guard, far above any loaded run, and bin/tests sets no
# limit of its own (test_no_wall_clock_limits.py says why). The slowest test takes
# 3.6 s alone.
# tmp_path_retention_policy keeps only failed tests' temp dirs: a full run leaves about
# 320 MB on the tmpfs every session's pytest shares (sandbox-setup's pytest-temproot).
[pytest]
addopts = -n auto --maxprocesses=6
timeout = 600
tmp_path_retention_policy = failed
