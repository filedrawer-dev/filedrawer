# bin/tests' settings, for the two plugins bin/agent-pre-commit's uvx line installs.
# pytest-xdist runs the tests in a worker per core the run may use, at most 8: more
# were no faster (docs/design.md, Checks). -n0 runs one file without starting them.
# pytest-timeout fails a test still running after `timeout` seconds, so a test that
# hangs can't hold the run: on 2026-11-06 a wizard test looping on a prompt waited 15
# hours. It is the one hang guard, far above any loaded run, and bin/tests sets no
# limit of its own (test_no_wall_clock_limits.py says why). The slowest test takes
# 3.6 s alone.
[pytest]
addopts = -n auto --maxprocesses=8
timeout = 600
