# Releases the `filedrawer` command (design.md, Distribution; #74, #84): the crates
# filedrawer-analyzer and filedrawer on crates.io; the PyPI package `filedrawer`,
# wheels that hold the filedrawer and entry-check binaries and an sdist, from
# crates/cli/pyproject.toml; and the npm packages @filedrawer/cli and
# @filedrawer/cli-<os>-<cpu> around the same filedrawer binaries, from
# crates/cli/npm/pack.mjs.
#
# A release is started by hand: ops/release-cli bumps crates/cli/Cargo.toml's
# version, pushes it, waits for CI's check job on it, then starts this on main.
# crates.io's trusted publishing refuses a workflow_run, so CI's completion can't
# start it (design.md, Distribution). bin/release-plan says what each registry lacks, after
# the analyzer rule. Every publish goes through trusted publishing, so no token is
# stored, from main's tip. A rerun finishes a release that stopped partway. A pull
# request that touches the packages builds and tests them only.
name: Release CLI

on:
  pull_request:
    paths:
      - crates/cli/**
      - crates/analyzer/**
      - Cargo.lock
      - .github/workflows/release-cli.yml
  workflow_dispatch:
    inputs:
      version:
        description: The version expected, as crates/cli/Cargo.toml has it (optional)
        required: false

permissions:
  contents: read

# One release at a time, held by the jobs only a release reaches (plan and the
# publishing jobs, a group each), not the workflow: GitHub keeps one pending run a
# group, so a pull request's run, which releases nothing, would cancel a pending
# release.

env:
  MATURIN: maturin@1.16.0

jobs:
  # Whether this may release: a run started from main, whose commit is still main's
  # tip, with a CI push run's check job passed on it. It fails otherwise, saying why.
  # The publishing jobs' environments are open to main only besides.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bin/release-plan
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/release-plan gate --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # What each registry lacks at that commit's versions, after the analyzer rule.
  plan:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-cli-plan
      cancel-in-progress: false
    outputs:
      sha: ${{ needs.gate.outputs.sha }}
      cli_version: ${{ steps.plan.outputs.cli_version }}
      crates_analyzer: ${{ steps.plan.outputs.crates_analyzer }}
      crates_cli: ${{ steps.plan.outputs.crates_cli }}
      pypi: ${{ steps.plan.outputs.pypi }}
      pypi_files: ${{ steps.plan.outputs.pypi_files }}
      npm: ${{ steps.plan.outputs.npm }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bin/release-plan plan ${VERSION:+--version "$VERSION"} >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Runs no third-party action, and builds nothing (bin/crates-release): the job can
  # mint a crates.io token. The `crates-io` environment, open to main only, is the
  # one each crate's trusted publisher names, set up once on each crate's crates.io
  # settings page (workflow release-cli.yml, environment crates-io). It waits for
  # the builds, so a release whose binaries fail publishes nowhere, and PyPI and npm
  # wait for it, so crates.io is never a version behind them.
  crates:
    needs: [plan, wheel, sdist]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.crates_analyzer == 'true' || needs.plan.outputs.crates_cli == 'true') &&
      needs.wheel.result != 'failure' && needs.sdist.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    concurrency:
      group: release-cli-crates
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - name: Publish
        env:
          ANALYZER: ${{ needs.plan.outputs.crates_analyzer }}
          CLI: ${{ needs.plan.outputs.crates_cli }}
        run: |
          flags=()
          if [ "$ANALYZER" = true ]; then flags+=(--analyzer); fi
          if [ "$CLI" = true ]; then flags+=(--cli); fi
          bin/crates-release "${flags[@]}"

  wheel:
    needs: plan
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.plan.outputs.build == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl), so one wheel serves glibc and musl
          # systems alike and carries both tags.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            compatibility: --compatibility manylinux2014 musllinux_1_2
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            compatibility: --compatibility manylinux2014 musllinux_1_2
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      # No cache: what builds a published file comes from PyPI at the version named,
      # not from what another job on main left in uv's cache.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The version rust-toolchain.toml names, which rustup then uses here.
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        run: >-
          uvx "$MATURIN" build --release --locked
          --manifest-path crates/cli/Cargo.toml --target ${{ matrix.target }}
          ${{ matrix.compatibility }} --out dist
      # Each runner runs its own wheel, as an agent's uvx would.
      - name: Run the wheel's commands
        run: |
          wheel=$(ls dist/*.whl)
          uvx --no-cache --from "$wheel" filedrawer -h
          uvx --no-cache --from "$wheel" filedrawer check crates/analyzer/tests/it/fixtures/example.md
          uvx --no-cache --from "$wheel" entry-check crates/analyzer/tests/it/fixtures/example.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
      # The npm package of this runner's platform, around the binary maturin built,
      # installed beside the launcher and run through npx, as an agent's npx would.
      # --offline: the launcher's other platform packages aren't fetched. What npm
      # installs with no lockfile is the two packages the step just packed.
      - name: Pack and run the npm packages
        run: | # zizmor: ignore[adhoc-packages]
          exe=target/${{ matrix.target }}/release/filedrawer
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          mkdir npm-dist npm-launcher npx-run
          node crates/cli/npm/pack.mjs platform ${{ matrix.target }} "$exe" npm-dist
          node crates/cli/npm/pack.mjs launcher npm-launcher
          cd npx-run
          echo '{}' > package.json
          npm install --offline --no-audit --no-fund ../npm-dist/*.tgz ../npm-launcher/*.tgz
          npx --no-install filedrawer -h
          npx --no-install filedrawer check ../crates/analyzer/tests/it/fixtures/example.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.target }}
          path: npm-dist/*.tgz
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-launcher
          path: npm-launcher/*.tgz

  sdist:
    needs: plan
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.plan.outputs.build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The sdist builds outside the checkout, where rustup finds no
      # rust-toolchain.toml, so the version it names becomes the default.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - run: uvx "$MATURIN" sdist --manifest-path crates/cli/Cargo.toml --out dist
      # A platform with no wheel builds from the sdist, so build it once that way.
      - name: Build and run from the sdist
        run: |
          sdist=$(ls dist/*.tar.gz)
          uvx --no-cache --from "$sdist" filedrawer check crates/analyzer/tests/it/fixtures/example.md
          uvx --no-cache --from "$sdist" entry-check -h
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # Runs no third-party action: the job can mint a PyPI upload token. The `pypi`
  # environment is the one PyPI's trusted publisher names (ops/claim-names).
  publish:
    needs: [plan, wheel, sdist, crates]
    if: >-
      !cancelled() && needs.plan.outputs.pypi == 'true' &&
      needs.wheel.result == 'success' && needs.sdist.result == 'success' &&
      needs.crates.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    concurrency:
      group: release-cli-pypi
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: bin/pypi-release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{wheel-*,sdist}"
          merge-multiple: true
      # The files must be the whole release at the plan's version. Those PyPI has
      # already are skipped, so a rerun finishes a release that stopped partway: a
      # rebuilt wheel isn't byte for byte the one PyPI holds, which it refuses
      # (run 43669677567; #87).
      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.cli_version }}
          FILES: ${{ needs.plan.outputs.pypi_files }}
        run: bin/pypi-release dist "$VERSION" "$FILES"

  # Runs no third-party action: the job can mint an npm publish token. The `npm`
  # environment is the one each package's trusted publisher names (ops/claim-names).
  # npm's trusted publishing needs npm 11.5.1 or later on node 22.14 or later.
  npm:
    needs: [plan, wheel, crates]
    if: >-
      !cancelled() && needs.plan.outputs.npm == 'true' && needs.wheel.result == 'success' &&
      needs.crates.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    concurrency:
      group: release-cli-npm
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: bin/npm-release
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: npm-*
          merge-multiple: true
      # The files must be the packages at the version given, as for PyPI; while npm
      # lacks the packages, which ops/claim-names makes, this publishes nothing.
      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.cli_version }}
        run: bin/npm-release dist "$VERSION"
