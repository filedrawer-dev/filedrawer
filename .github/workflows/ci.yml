# Every check the commit hooks run, over every file, on each push to main and each pull
# request: the pre-commit hooks (slop-lint, ruff, lychee through bin/lychee, cargo fmt), then
# the tests and clippy through bin/agent-pre-commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v10.3.3
      # The formatters write; the diff shows what was unformatted.
      - run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
      - run: bin/agent-pre-commit

  # A push to main that passes the checks deploys to staging (design.md, Hosting and
  # operations). The binary is static (musl), built for the CX23's x86_64. Building and
  # deploying are separate jobs, so no third-party action runs while the deploy key is
  # on disk. The key may only run filedrawer-receive on the VPS, which hands the upload
  # to filedrawer-install: it checks the hash, installs with a health check, and rolls
  # back on failure. ops/provision-vps sets up the key and writes DEPLOY_SSH_KEY (a
  # secret of the `staging` environment, which only main may deploy to), VPS_HOST and
  # VPS_KNOWN_HOSTS.
  build-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINARY: target/x86_64-unknown-linux-musl/release/filedrawer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      # SQLite's C code compiles into the binary, so the musl C compiler is needed.
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin filedrawer
      - name: Check the binary is static
        run: |
          file "$BINARY"
          file "$BINARY" | grep -Eq "static(ally|-pie) linked"
          "$BINARY" -h > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: filedrawer
          path: ${{ env.BINARY }}
          retention-days: 7

  deploy-staging:
    needs: build-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: filedrawer
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > known_hosts
          hash=$(sha256sum filedrawer | cut -d' ' -f1)
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "deploy@$VPS_HOST" "deploy staging $hash" < filedrawer

  # After each deploy, ops/smoke-staging follows /skill.md against staging as an agent
  # would, as an account of its own. deploy-staging succeeds only once the new binary
  # passed filedrawer-install's health check, and the script's --wait then waits for
  # /skill.md to answer through Caddy. Smoke entries stay on staging. This job holds
  # the staging key and the smoke account's token (STAGING_KEY and SMOKE_TEST_TOKEN,
  # secrets of the `staging` environment that ops/provision-vps sets), so it runs no
  # third-party action.
  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: smoke-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Smoke test
        env:
          FILEDRAWER_STAGING_KEY: ${{ secrets.STAGING_KEY }}
          FILEDRAWER_STAGING_API_KEY: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: ops/smoke-staging --wait 120 https://staging.filedrawer.dev

  # After each deploy, ops/smoke-staging screen checks that staging screens with the
  # real model, as the screen-test account, for a few Haiku calls. This job holds
  # the staging key and that account's token (SCREEN_TEST_TOKEN, which
  # `ops/provision-vps smoke` stores from ops/.screen-test.env), so it runs no
  # third-party action. Without the token, or on a day whose screening cap is spent
  # (the script's exit status 3), it passes with a warning: nothing was checked.
  screen-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: screen-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Screen with the real model
        env:
          FILEDRAWER_STAGING_KEY: ${{ secrets.STAGING_KEY }}
          FILEDRAWER_STAGING_SCREEN_API_KEY: ${{ secrets.SCREEN_TEST_TOKEN }}
        run: |
          if [ -z "$FILEDRAWER_STAGING_SCREEN_API_KEY" ]; then
            echo "::warning::Screening wasn't checked: SCREEN_TEST_TOKEN isn't set; ops/provision-vps --only-new smoke stores it."
            exit 0
          fi
          status=0
          ops/smoke-staging screen --wait 120 https://staging.filedrawer.dev || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::Screening wasn't checked: the day's screening cap is spent."
            exit 0
          fi
          exit "$status"
