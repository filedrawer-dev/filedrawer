# Every check the commit hooks run, over every file, on each push to main and each pull
# request: the pre-commit hooks (slop-lint, lychee through bin/lychee, cargo fmt), then
# the tests and clippy through bin/agent-pre-commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uvx pre-commit@4.7.0 run --all-files
      - run: bin/agent-pre-commit
